name: WordPress.org readme and assets

# Publishes readme.txt and .wordpress-org/ to WordPress.org without a new release, for example
# after updating "Tested up to" or a screenshot. Run it from the Actions tab; it needs the same
# SVN secrets as the release workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy readme.txt and .wordpress-org/
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: reports-graph-for-sensei-lms
          ASSETS_DIR: .wordpress-org
          README_NAME: readme.txt
          IGNORE_OTHER_FILES: true
